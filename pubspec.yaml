name: genux
description: "A native Flutter SDUI engine and showcase with a future GenUI adapter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/views/customer-edit.genux.json
    - assets/views/customer-summary.genux.json
    - assets/views/customer-list.genux.json
    - assets/views/component-lab.genux.json
