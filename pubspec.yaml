name: genux
description: Reusable Flutter UI primitives for AIX applications.
version: 1.0.2
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  a2ui_core: ^0.7.0
  json_schema_builder: ^0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: MaterialSymbols
      fonts:
        - asset: assets/fonts/material_symbols/MaterialSymbolsOutlined.ttf
